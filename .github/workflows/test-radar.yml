name: Offline Radar Analytics Tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/radar.py'
      - 'scripts/backfill.py'
      - 'scripts/radar_backfill_core.py'
      - 'scripts/test_backfill.py'
      - 'scripts/test_radar.py'
      - '.github/workflows/test-radar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and offline unit tests
        run: |
          python -m py_compile scripts/radar.py scripts/collect.py scripts/backfill.py scripts/radar_backfill_core.py scripts/test_radar.py scripts/test_backfill.py
          python -m unittest discover -s scripts -p 'test_*.py' -v
