name: Offline Radar Analytics Tests
on:
  push:
    branches: [main]
    paths:
      - 'scripts/radar.py'
      - 'scripts/backfill.py'
      - 'scripts/radar_backfill_core.py'
      - 'scripts/test_backfill.py'
      - 'scripts/export_kiwoom_watchlist.py'
      - 'scripts/test_watchlist_export.py'
      - 'scripts/test_radar.py'
      - 'scripts/collect.py'
      - 'radar-chart.js'
      - 'radar-tv-chart.js'
      - 'radar-tv-chart.css'
      - 'tests/radar-tv-chart.test.cjs'
      - 'radar-chart.css'
      - 'radar-ui.js'
      - 'tests/radar-chart.test.cjs'
      - '.github/workflows/test-radar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax and offline unit tests
        run: |
          python -m py_compile scripts/radar.py scripts/collect.py scripts/backfill.py scripts/radar_backfill_core.py scripts/test_radar.py scripts/test_backfill.py scripts/export_kiwoom_watchlist.py scripts/test_watchlist_export.py
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Static chart JavaScript and indicator tests
        run: |
          node --check radar-chart.js
          node --check radar-tv-chart.js
          node --check radar-ui.js
          node tests/radar-chart.test.cjs
          node tests/radar-tv-chart.test.cjs
